name: Build macOS Release

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      description:
        description: '版本描述'
        required: false
        default: '手动构建的macOS版本'
      no_sign:
        description: '跳过签名与公证（适合内部调试）true/false'
        required: false
        default: 'false'

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
    - name: Show runner info
      run: |
        echo "Runner OS: $(sw_vers)"
        echo "Kernel: $(uname -a)"
        echo "Machine arch: $(uname -m)"
        sysctl -n machdep.cpu.brand_string || true
        python3 --version || true
        which python3 || true
        echo "Target build arch: ${BUILD_ARCH}"

    - name: Enforce target arch
      run: |
        ACTUAL=$(uname -m)
        echo "Actual runner arch: ${ACTUAL}, target: ${BUILD_ARCH}"
        if [ "${BUILD_ARCH}" = "x86_64" ] && [ "${ACTUAL}" != "x86_64" ]; then
          echo "Error: x86_64 build must run on Intel runner. Current runner is ${ACTUAL}." >&2
          exit 1
        fi
        if [ "${BUILD_ARCH}" = "arm64" ] && [ "${ACTUAL}" != "arm64" ]; then
          echo "Error: arm64 build must run on Apple Silicon runner. Current runner is ${ACTUAL}." >&2
          exit 1
        fi
    - name: Debug Event Info
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Event action: ${{ github.event.action }}"
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "Release tag: ${{ github.event.release.tag_name }}"
          echo "Release name: ${{ github.event.release.name }}"
          echo "Release draft: ${{ github.event.release.draft }}"
          echo "Release prerelease: ${{ github.event.release.prerelease }}"
        fi
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build macOS app
      run: python build_macos.py

    - name: Fix app permissions and sign
      run: |
        # Use our dedicated fix script for comprehensive app fixing
        python fix_macos_app.py dist/DuokiEditor.app
        
        cd dist
        if [ -d "DuokiEditor.app" ]; then
          # Ensure proper Info.plist is in place
          cp ../Info.plist DuokiEditor.app/Contents/Info.plist
          
          # 检查应用结构
          echo "App bundle structure:"
          find DuokiEditor.app -type f -name "*.py" | head -10
          find DuokiEditor.app -type f -name "DuokiEditor" | head -5
          
          # 创建启动脚本来捕获错误
          echo '#!/bin/bash' > DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'cd "$(dirname "$0")"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'echo "Starting DuokiEditor..."' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'echo "Current directory: $(pwd)"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'echo "Python path: $PYTHONPATH"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'LOG_DIR="$HOME/DuokiEditor_logs"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'CRASH_LOG="$HOME/DuokiEditor_crash.log"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'mkdir -p "$LOG_DIR"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'TIMESTAMP=$(date "+%Y%m%d_%H%M%S")' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'DEBUG_LOG="$LOG_DIR/duoki_editor_debug_$TIMESTAMP.log"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'echo "日志文件将保存在: $DEBUG_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'echo "如果应用崩溃，崩溃日志将保存在: $CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo './DuokiEditor 2>&1 | tee "$DEBUG_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'EXIT_CODE=$?' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'echo "应用退出代码: $EXIT_CODE"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'if [ $EXIT_CODE -ne 0 ]; then' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '  echo "应用异常退出，请查看日志文件: $DEBUG_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '  if [ ! -f "$CRASH_LOG" ]; then' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    echo "未找到崩溃日志，创建一个基本的崩溃记录"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    echo "DuokiEditor崩溃时间: $(date)" > "$CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    echo "退出代码: $EXIT_CODE" >> "$CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    echo "调试日志位置: $DEBUG_LOG" >> "$CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    echo "\n系统信息:" >> "$CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    uname -a >> "$CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    echo "\n最后100行日志:" >> "$CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '    tail -n 100 "$DEBUG_LOG" >> "$CRASH_LOG"' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo '  fi' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'fi' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          echo 'exit $EXIT_CODE' >> DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          chmod +x DuokiEditor.app/Contents/MacOS/DuokiEditor_debug
          
          # Additional signing step (the fix script already did basic signing)
          if [ "${{ github.event.inputs.no_sign }}" = "true" ]; then
             echo "Skipping additional signing as per no_sign input"
           elif [ -z "${{ secrets.DEVELOPER_ID }}" ]; then
             echo "No Developer ID provided, ad-hoc signature already applied by fix script"
           else
             echo "Developer ID secrets detected; real signing will occur in a separate step"
           fi

          # Verify the current signature
          codesign --verify --verbose DuokiEditor.app && echo "✓ App signature verified" || echo "⚠ Signature verification failed"
          
          echo "Fixed macOS app permissions and signing"
        else
          echo "Error: DuokiEditor.app not found"
          exit 1
        fi

    - name: Import signing certificate (Developer ID)
      if: ${{ github.event.inputs.no_sign != 'true' }}
      run: |
        # Check if all required secrets are available
        if [ -z "$DEVELOPER_ID" ] || [ -z "$MACOS_CERT_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
          echo "Missing required secrets for Developer ID signing. Skipping certificate import."
          exit 0
        fi
        
        KEYCHAIN=build.keychain
        KEYCHAIN_PWD=buildpwd
        security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
        echo "$MACOS_CERT_BASE64" | base64 --decode > signing.p12
        security import signing.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security list-keychains -d user -s "$KEYCHAIN" login.keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
      env:
        DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

    - name: Sign app with Developer ID
      if: ${{ github.event.inputs.no_sign != 'true' }}
      run: |
        # Check if Developer ID secret is available
        if [ -z "$DEVELOPER_ID" ]; then
          echo "Missing Developer ID secret. Skipping Developer ID signing."
          exit 0
        fi
        
        cd dist
        if [ -d "DuokiEditor.app" ]; then
          codesign --force --options runtime --timestamp --deep \
            --entitlements ../entitlements.plist \
            -s "${DEVELOPER_ID}" DuokiEditor.app
          codesign --verify --strict --deep --verbose=2 DuokiEditor.app
        else
          echo "Error: DuokiEditor.app not found for signing"
          exit 1
        fi
      env:
        DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}

    - name: Create macOS package
      run: |
        cd dist
        if [ -d "DuokiEditor.app" ]; then
          # Create a DMG file for better macOS distribution
          mkdir -p DuokiEditor-macOS
          cp -R DuokiEditor.app DuokiEditor-macOS/
          
          # Create a symbolic link to Applications folder
          ln -s /Applications DuokiEditor-macOS/Applications
          
          # Create DMG
          hdiutil create -volname "DuokiEditor" -srcfolder DuokiEditor-macOS -ov -format UDZO DuokiEditor-macOS-${BUILD_ARCH}.dmg
          
          # Also create tar.gz for compatibility
          tar -czf DuokiEditor-macOS-${BUILD_ARCH}.tar.gz DuokiEditor.app
          
          # Move files to root
          mv DuokiEditor-macOS-${BUILD_ARCH}.dmg ../
          mv DuokiEditor-macOS-${BUILD_ARCH}.tar.gz ../
        else
          echo "Error: DuokiEditor.app not found"
          exit 1
        fi

    - name: Notarize and staple (Apple)
      if: ${{ github.event.inputs.no_sign != 'true' }}
      run: |
        # Check if all required notarization secrets are available
        if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
          echo "Missing required secrets for notarization. Skipping notarization and stapling."
          exit 0
        fi
        
        xcrun notarytool submit "DuokiEditor-macOS-${BUILD_ARCH}.dmg" \
          --apple-id "$NOTARY_APPLE_ID" \
          --team-id "$NOTARY_TEAM_ID" \
          --password "$NOTARY_PASSWORD" \
          --wait
        # Staple both DMG and .app
        xcrun stapler staple "DuokiEditor-macOS-${BUILD_ARCH}.dmg" || true
        xcrun stapler staple "dist/DuokiEditor.app" || true
      env:
        NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuokiEditor-macOS-${{ matrix.arch }}-DMG
        path: DuokiEditor-macOS-${{ matrix.arch }}.dmg
        retention-days: 7

    - name: Upload tar.gz artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuokiEditor-macOS-${{ matrix.arch }}-Archive
        path: DuokiEditor-macOS-${{ matrix.arch }}.tar.gz
        retention-days: 7

    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          DuokiEditor-macOS-${{ matrix.arch }}.dmg
          DuokiEditor-macOS-${{ matrix.arch }}.tar.gz
        fail_on_unmatched_files: false
        tag_name: ${{ github.event.release.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
