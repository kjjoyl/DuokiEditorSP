name: Build Windows Release

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      description:
        description: '版本描述'
        required: false
        default: '手动构建的Windows版本'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Debug Event Info
      run: |
        Write-Host "Event name: ${{ github.event_name }}"
        Write-Host "Event action: ${{ github.event.action }}"
        if ("${{ github.event_name }}" -eq "release") {
          Write-Host "Release tag: ${{ github.event.release.tag_name }}"
          Write-Host "Release name: ${{ github.event.release.name }}"
          Write-Host "Release draft: ${{ github.event.release.draft }}"
          Write-Host "Release prerelease: ${{ github.event.release.prerelease }}"
        }
      shell: powershell
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Windows app
      run: python build_windows.py

    - name: Create Windows package
      run: |
        # 检查构建输出
        Write-Host "Checking build output..."
        if (Test-Path "dist") {
          Get-ChildItem -Path "dist" -Recurse | Format-Table Name, FullName
        } else {
          Write-Host "Error: dist directory not found"
          exit 1
        }
        
        cd dist
        # 检查是否有DuokiEditor目录（onedir模式）
        if (Test-Path "DuokiEditor") {
          Write-Host "Found DuokiEditor directory, checking for executable..."
          Get-ChildItem -Path "DuokiEditor" | Format-Table Name
          
          if (Test-Path "DuokiEditor/DuokiEditor.exe") {
            Write-Host "Found DuokiEditor.exe in directory, creating zip..."
            # 压缩整个DuokiEditor目录
            Compress-Archive -Path "DuokiEditor" -DestinationPath "../DuokiEditor-Windows.zip" -Force
          } else {
            Write-Host "Error: DuokiEditor.exe not found in DuokiEditor directory"
            Get-ChildItem -Path "DuokiEditor" -Recurse | Format-Table Name, FullName
            exit 1
          }
        } elseif (Test-Path "DuokiEditor.exe") {
          Write-Host "Found DuokiEditor.exe in dist root, creating zip..."
          # 如果是onefile模式，直接压缩exe文件
          Compress-Archive -Path "DuokiEditor.exe" -DestinationPath "../DuokiEditor-Windows.zip" -Force
        } else {
          Write-Host "Error: DuokiEditor.exe not found in any expected location"
          Write-Host "Available files in dist:"
          Get-ChildItem -Path "." -Recurse | Format-Table Name, FullName
          exit 1
        }
      shell: powershell

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuokiEditor-Windows
        path: DuokiEditor-Windows.zip
        retention-days: 7

    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          DuokiEditor-Windows.zip
        fail_on_unmatched_files: false
        tag_name: ${{ github.event.release.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}